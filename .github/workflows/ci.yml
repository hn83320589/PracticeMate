name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore PracticeMate.sln

      - name: Build
        run: dotnet build PracticeMate.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test PracticeMate.sln -c Release --no-build
          --filter "Category!=Performance"
          --logger "trx;LogFilePrefix=results"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      # 效能測試在 CI runner 上僅供參考（硬體不固定），不影響綠燈；正式數據見 README
      - name: Performance tests (informational)
        continue-on-error: true
        run: dotnet test tests/PracticeMate.Performance.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish win-x64
        run: >
          dotnet publish src/PracticeMate.App/PracticeMate.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Upload win-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PracticeMate-win-x64
          path: publish/win-x64
